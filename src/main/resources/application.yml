# 本地数据目录：运行时从此目录读写 campaigns.json / performance.json，默认为当前工作目录下的 data/
ad-agent:
  data:
    base-path: ${user.dir}/data
  # 长期记忆写入时机：true=每轮对话结束立即写入，false=空闲 5 分钟后在下一轮开始时写入
  memory:
    immediate-long-term-flush: true
  # 自动调价助手（α）：定时任务 + LLM（学习项目，数据可自造）
  bidding:
    enabled: true
    cron: "0 0 * * * ?"
    # 定时任务遍历该用户名下所有计划并分别调价；留空则读全局 campaigns.json
    schedule-user-id: "10001"
    alpha-min: 0.5
    alpha-max: 1.5
    max-relative-change: 0.2
    job-log-max-entries: 30
  # RAG（Qdrant）：默认关闭，本地验证用 profile rag 或 local-verify 脚本
  rag:
    enabled: false
    top-k: 5
    similarity-threshold: 0.55
    diagnostics: false
    reindex-on-startup: false

spring:
  application:
    name: ad-agent

  profiles:
    include: secret

  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.qdrant.autoconfigure.QdrantVectorStoreAutoConfiguration

  ai:
    markdown-skills:
      enabled: true
      locations:
        - classpath*:skills/**/*.md
      max-body-chars: 12000
    model:
      chat: openai
      image: openai
      # 默认不启用 Embedding；RAG 本地用 profile rag-local，云端用 profile rag
      embedding: none
    openai:
      # 勿带 /v1 后缀，Spring AI 会自动拼接 /v1/chat/completions
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.7
      image:
        options:
          # MiniMax 用 image-01；OpenAI 用 dall-e-3
          model: ${OPENAI_IMAGE_MODEL:image-01}
    tool:
      enabled: true
      internal-tool-execution-enabled: true
    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        collection-name: ad_agent_rag
        initialize-schema: true

server:
  port: 8081

logging:
  level:
    root: INFO
    org.springframework.ai: DEBUG
    com.shanananana.adagent: INFO
